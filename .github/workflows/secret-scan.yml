name: Secret Scan

# A SEPARATE blocking check, not a step inside the PR gate.
#
# It lives in its own workflow because it needs a network download and a
# third-party binary, neither of which belongs in a lane advertised as hermetic.
# Two checks, honestly labelled, fail independently and diagnose differently.
#
# Scope differs by event, which keeps it cheap and keeps a gitleaks rule-set
# update from red-lining every open pull request at once:
#   pull_request  -> the pull request range only (base..head)
#   push:main     -> full history across all refs
#   schedule      -> full history across all refs, so rule updates surface
#                    without waiting for a push
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: secret-scan
    # Fork-guarded, same reasoning as the gate: this workflow is reachable from a
    # fork pull request, and a repository variable must never be able to route
    # THAT onto a persistent shared pool. The head.repo.fork test pins a fork pull
    # request to hosted regardless of RUNNER_LABELS, and merge_group is pinned
    # unconditionally because its payload has no pull_request object, leaving the
    # fork test blind on the one event whose merge commit carries the
    # contributor's code. Everything else takes the pool, which is what keeps this
    # lane from sitting an hour in the hosted queue.
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The history scan is `gitleaks detect --log-opts=--all`. A shallow
          # clone silently degrades that from the full history to almost
          # nothing WITHOUT failing: a false green on the gate protecting a
          # public repository.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-gitleaks

      # Exported here rather than in a job-level env: block, because the `runner`
      # context is NOT available at job level and a workflow referencing it there
      # is rejected outright, producing a run with zero jobs. $RUNNER_TEMP is the
      # plain environment variable and is always set.
      #
      # The report lands in the runner temp so it can be uploaded, and is unique
      # per job so concurrent runs on a shared pool cannot race on one path.
      - name: Resolve report path
        run: echo "GITLEAKS_REPORT=$RUNNER_TEMP/gitleaks-history.json" >> "$GITHUB_ENV"

      # Anti-theater positive control, on EVERY leg including pull_request.
      #
      # It was previously skipped on pull_request for cost, which had the logic
      # backwards: a scanner-configuration regression can only ARRIVE by pull
      # request, and the PR-range scan cannot tell "clean" from "no rules
      # loaded", so the one event that can introduce the defect was the one
      # event that did not check for it. Measured cost is ~0.2 s in a job that
      # has already paid for the gitleaks binary.
      #
      # It proves the default rule set is LOADED and that the allowlist has not
      # swallowed the JWT shape. It does NOT detect an allowlist widened by path,
      # which is why /.gitleaks.toml sits under CODEOWNERS.
      - name: Self-test the scanner (must detect planted credentials)
        run: bash .github/scripts/gitleaks-selftest.sh

      - name: Scan the pull request range
        if: github.event_name == 'pull_request'
        env:
          # Both shas come from the event payload, never from a branch name, so
          # there is nothing here an attacker-controlled ref can influence.
          GITLEAKS_LOG_OPTS: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: bash optimization/scripts/check-secrets.sh

      - name: Scan tracked content and full history
        if: github.event_name != 'pull_request'
        run: bash optimization/scripts/check-secrets.sh

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-history.json
          if-no-files-found: ignore
          retention-days: 7
