name: Baseline Audit (deterministic + qualitative)

# The qualitative audit lane: a static 0-10 visual judge over rendered baselines,
# which live under the gitignored optimization/runs/, so this workflow renders
# them first and then runs `cesium-eval audit` over the fresh bundles.
#
# This lane is ADVISORY and is never reachable from a pull request. The blocking
# contract lane moved to pr-gate.yml, which runs unconditionally on every pull
# request and does strictly more than the deterministic job that used to live
# here (it adds the scorecard, the fixture-expectation check, the console tests,
# and a clean-tree assertion). The deterministic job below now calls that one
# definition rather than keeping a second, drifting copy.

on:
  workflow_dispatch:
    inputs:
      skills:
        description: "Skills to audit ('all' or comma-separated)"
        required: false
        default: 'all'
      judge_model:
        description: 'Judge model id/alias (blank uses harness default)'
        required: false
        default: ''
      agent_harness:
        description: 'Agent CLI harness for qualitative audit'
        required: false
        default: 'opencode'
        type: choice
        options:
          - opencode
          - codex
      n_judges:
        description: 'Panel size'
        required: false
        default: '3'
  schedule:
    - cron: '0 3 * * *'   # nightly qualitative audit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----- Lane 1: the deterministic gate, by reference (SEAM-0) -----
  # One definition, called before any money is spent. A reusable-workflow job
  # takes no timeout-minutes; the called workflow's own jobs carry the bound.
  deterministic:
    uses: ./.github/workflows/pr-gate.yml

  # ----- Preflight: does this lane have what it needs to run at all? -----
  # Before this job existed, a missing CESIUM_ION_TOKEN failed the nightly at the
  # "Validate secrets" step, so the scheduled run was RED every night purely
  # because the secret was never configured. A permanently-red scheduled job is
  # worse than no scheduled job: it trains maintainers to ignore red, which is
  # the one signal a nightly exists to produce. An unconfigured credential is a
  # "not applicable", not a regression, so it now reports as a clean skip with a
  # visible reason. A secret that IS configured but broken still fails loudly.
  preflight:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required credentials
        id: check
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          AGENT_HARNESS: ${{ github.event.inputs.agent_harness || vars.AGENT_HARNESS || 'opencode' }}
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
          CODEX_AUTH_CONTENT: ${{ secrets.CODEX_AUTH_CONTENT }}
        run: |
          missing=()
          [ -n "$CESIUM_ION_TOKEN" ] || missing+=(CESIUM_ION_TOKEN)
          # Whichever harness this run selected must have ITS credential. The
          # earlier form only knew about opencode, so a codex run with no
          # CODEX_AUTH_CONTENT passed preflight and then failed downstream —
          # the permanently-red-nightly failure mode this job exists to prevent,
          # reintroduced through the other harness.
          case "$AGENT_HARNESS" in
            opencode) [ -n "$OPENCODE_AUTH_CONTENT" ] || missing+=(OPENCODE_AUTH_CONTENT) ;;
            codex)    [ -n "$CODEX_AUTH_CONTENT" ] || missing+=(CODEX_AUTH_CONTENT) ;;
          esac
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Qualitative audit skipped"
              echo
              echo "Not run because these repository secrets are not configured:"
              echo
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo
              echo "This is a configuration gap, not an evaluation regression."
              echo "Configure the secrets to enable this lane."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Qualitative audit skipped::missing secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # ----- Lane 2: qualitative (nightly / dispatch, advisory) -----
  qualitative:
    needs: [deterministic, preflight]
    if: needs.preflight.outputs.ready == 'true'
    # Hosted unless this repo defines RUNNER_LABELS (a JSON array of runner
    # labels). CODEX_RUNNER_LABELS narrows further to the one runner holding
    # the codex credential: this lane can select the codex harness, and codex
    # sessions must not be refreshed from two machines (see
    # setup-agent-harness/action.yml).
    runs-on: ${{ fromJSON(vars.CODEX_RUNNER_LABELS || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    env:
      # Single source of truth for the bundle layout. `render-baselines --out`
      # writes exactly the directory shape that `audit --bundle-root` reads, so
      # the two must always be given the same value. It is under the gitignored
      # evaluation/artifacts/ tree.
      BUNDLE_ROOT: evaluation/artifacts/baselines
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A contents: read installation token otherwise sits in
          # $GITHUB_WORKSPACE/.git/config for the job's lifetime, readable by the
          # npm dependency tree and by the agent CLI running in this same job.
          # Nothing here performs an authenticated git operation.
          persist-credentials: false
      - uses: ./.github/actions/setup-eval
      - run: |
          npm run build --workspace @cesiumjs-skills/eval
          npx playwright install --with-deps chromium
      # Installs the CLI AND writes its credential to the path the CLI reads.
      # This step used to install the binary and separately assert the secret was
      # non-empty, which is not the same thing: nothing ever wrote
      # ~/.local/share/opencode/auth.json, and opencode does not read its
      # credential from the environment, so this lane reached its first model
      # call unauthenticated. The action also shape-checks the credential, which
      # is what the old "Validate secrets" step was reaching for.
      - uses: ./.github/actions/setup-agent-harness
        with:
          harness: ${{ github.event.inputs.agent_harness || vars.AGENT_HARNESS || 'opencode' }}
          codex-auth-content: ${{ secrets.CODEX_AUTH_CONTENT }}
          opencode-auth-content: ${{ secrets.OPENCODE_AUTH_CONTENT }}
      - uses: ./.github/actions/install-gitleaks
      - name: Validate the Ion token
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          test -n "$CESIUM_ION_TOKEN" || { echo "CESIUM_ION_TOKEN missing"; exit 1; }
      # `render-baselines` is the purpose-built command for exactly this step: it
      # renders the current scenario baselines into the bundle layout that
      # `audit --bundle-root` reads, and it writes only under the gitignored
      # output root.
      #
      # It replaces `optimize all --max-iterations 1`, which was a workaround
      # predating this command and which called updatePublicStatus() into the
      # TRACKED optimization/results/public-status.json on every iteration, with
      # no --promote guard (loop.ts:366). Since `validate --suite optimization`
      # cross-checks that file and is now a blocking gate step, the old form let
      # a scheduled job rewrite an input of the gate: the pipeline grading
      # itself. .github/scripts/workflow-safety.sh rule 1 now forbids it
      # mechanically.
      - name: Render current-best baselines (gitignored; needed for the visual lane)
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          # Free-form inputs are passed through the environment, never
          # interpolated into the shell text of a run block, so a crafted input
          # value cannot become shell syntax.
          SKILLS: ${{ github.event.inputs.skills || 'all' }}
        run: |
          node packages/eval/bin/cesium-eval.js render-baselines \
            --skills "$SKILLS" \
            --out "$BUNDLE_ROOT"
      # No continue-on-error. A lane expresses advisory-ness by not being a
      # required check, never by suppressing its own failures: this workflow is
      # reachable only by schedule and workflow_dispatch, so red here is
      # informative rather than blocking, and a suppressed red is just noise
      # dressed as green.
      - name: Qualitative + deterministic baseline audit (advisory)
        id: audit
        shell: bash
        env:
          AGENT_HARNESS: ${{ github.event.inputs.agent_harness || vars.AGENT_HARNESS || 'opencode' }}
          # Model ids and reasoning-effort levels are CONFIGURATION, not
          # credentials, so they resolve from inputs, then repository variables,
          # then a literal default. A `secrets.*` tier used to sit before the
          # default; it is deliberately gone. Routing non-secret config through
          # the secrets namespace inflates the apparent credential surface (it
          # made this pipeline look like it held a dozen secrets when it holds
          # one), hides the effective value from anyone reading the settings
          # page, and buys nothing: a model id is not sensitive.
          OPENCODE_MODEL: ${{ github.event.inputs.judge_model || vars.OPENCODE_MODEL || 'openai/gpt-5.5' }}
          OPENCODE_JUDGE_MODEL: ${{ vars.OPENCODE_JUDGE_MODEL || 'openai/gpt-5.5' }}
          OPENCODE_JUDGE_VARIANT: ${{ vars.OPENCODE_JUDGE_VARIANT || 'medium' }}
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
          SKILLS: ${{ github.event.inputs.skills || 'all' }}
          N_JUDGES: ${{ github.event.inputs.n_judges || '3' }}
        run: |
          CMD=(node packages/eval/bin/cesium-eval.js audit
            --skills "$SKILLS"
            --judge-harness "$AGENT_HARNESS"
            --n-judges "$N_JUDGES"
            --bundle-root "$BUNDLE_ROOT"
            --output-dir evaluation/artifacts/audits/ci)
          if [ "$AGENT_HARNESS" = "opencode" ] && [ -n "$OPENCODE_MODEL" ]; then
            CMD+=(--judge-model "$OPENCODE_MODEL")
          fi
          "${CMD[@]}"
      # Ordering matters: delete the token-bearing HTML FIRST, then scan, then
      # upload. `check public-artifacts` and `check-secrets.sh` both scan only
      # git-TRACKED files, and every bundle path here is gitignored, so neither
      # inspects a single byte of what is about to be uploaded. The explicit
      # find over the bundle roots is the only step that actually touches it.
      - name: Sanitize before upload
        id: sanitize
        if: always()
        run: |
          find "$BUNDLE_ROOT" evaluation/artifacts/audits -name '*.html' -delete 2>/dev/null || true
          node packages/eval/bin/cesium-eval.js check public-artifacts
          bash optimization/scripts/check-secrets.sh
          if find "$BUNDLE_ROOT" evaluation/artifacts/audits -name '*.html' 2>/dev/null | grep -q .; then
            echo "::error title=Sanitization failed::HTML survived the delete pass; refusing to upload."
            exit 1
          fi
      - name: Upload audit scorecard
        # Gated on the sanitizer SUCCEEDING, not merely on having run. With
        # `if: always()` alone, a sanitize step that exits non-zero (a surviving
        # token-bearing file, a tracked-secret hit) still publishes the bundle it
        # just failed to clean. Still runs when the loop itself failed, because a
        # failed run's artifacts are the diagnostic material.
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: baseline-audit-qualitative-${{ github.run_number }}
          path: |
            evaluation/artifacts/audits/ci/scorecard.*
            evaluation/artifacts/audits/ci/**/scorecard.*
