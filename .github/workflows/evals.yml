name: Public Eval Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "optimization/**"
      - "evaluation/**"
      - "docs/**"
      - "packages/eval/**"
      - "apps/evaluation-console/**"
      - "config/**"
      - "eval.config.json"
      - ".architecture/**"
      - "wiki/**"
      - ".github/workflows/evals.yml"
  push:
    branches: [ main, wiki-acd-sync ]
    paths:
      - "optimization/**"
      - "evaluation/**"
      - "docs/**"
      - "packages/eval/**"
      - "apps/evaluation-console/**"
      - "config/**"
      - "eval.config.json"
      - ".architecture/**"
      - "wiki/**"
      - ".github/workflows/evals.yml"

jobs:
  validate:
    # Hosted unless this repo defines RUNNER_LABELS (a JSON array of runner labels).
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}

    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks scan

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.18.2
          # Runner architecture varies (hosted runners are x64; a self-hosted
          # pool may be ARM64), so the asset is selected rather than hardcoded.
          case "$(uname -m)" in
            x86_64) GITLEAKS_ARCH=x64 ;;
            aarch64 | arm64) GITLEAKS_ARCH=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          wget "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz"
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build eval CLI
        run: npm run build --workspace @cesiumjs-skills/eval

      - name: Build evaluation console
        run: npm run build --workspace @cesiumjs-skills/evaluation-console

      - name: Run unit tests
        run: npm test --workspace @cesiumjs-skills/eval

      - name: Validate eval manifests (evaluation + optimization lanes)
        run: node packages/eval/bin/cesium-eval.js validate --suite all

      - name: Run deterministic baseline audit
        run: |
          node packages/eval/bin/cesium-eval.js audit \
            --skills all \
            --no-judge \
            --output-dir evaluation/artifacts/audits/ci-smoke

      - name: Check canonical eval surface
        run: node packages/eval/bin/cesium-eval.js check canonical-surface

      - name: Scan public docs and eval artifacts
        run: node packages/eval/bin/cesium-eval.js check public-artifacts

      - name: Check for secrets in tracked content
        run: bash optimization/scripts/check-secrets.sh
